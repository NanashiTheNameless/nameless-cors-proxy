# wrangler.toml (wrangler ^4.71.0)
#
# Optional RELAY_SECRET secret enables retrying 525 hops through relay/:
#   wrangler secret put RELAY_SECRET

name="nameless-cors-proxy"
main="index.ts"
compatibility_date="2026-02-24"

workers_dev=false

send_metrics=false

[[routes]]
pattern="cors.namelessnanashi.dev/*"
zone_name="namelessnanashi.dev"

[observability]
enabled=false

[placement]
mode="smart"

[assets]
directory="./0xProto"
